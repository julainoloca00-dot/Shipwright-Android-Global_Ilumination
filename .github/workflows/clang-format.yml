name: clang-format
on: [pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Format changed source files
        shell: bash
        run: |
          mapfile -d '' changed_files < <(git diff --name-only -z --diff-filter=ACMRT HEAD^1 HEAD)
          files_to_format=()

          for file in "${changed_files[@]}"; do
            case "$file" in
              soh/assets/*)
                continue
                ;;
              soh/src/*.h|soh/include/*.h)
                continue
                ;;
              soh/*.c|soh/*.cpp|soh/*.h|soh/*.hpp)
                files_to_format+=("$file")
                ;;
            esac
          done

          if (( ${#files_to_format[@]} > 0 )); then
            clang-format-14 -i "${files_to_format[@]}"
          fi

          git diff --exit-code
