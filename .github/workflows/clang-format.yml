name: clang-format
on: [pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Run clang-format
        run: ./run-clang-format.sh
      - name: Package formatted output
        run: |
          git diff > clang-format.patch
          git diff --name-only -z | tar --null -T - -czf clang-format-files.tar.gz
      - name: Upload formatted output
        uses: actions/upload-artifact@v4
        with:
          name: clang-format-output
          path: |
            clang-format.patch
            clang-format-files.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Verify formatting
        run: git diff --exit-code
