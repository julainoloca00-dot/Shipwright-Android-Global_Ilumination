name: SOHCS Sun Shadows Android Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sohcs-sun-shadows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Merge Celshade and Build SOHCS Sun Shadows
    runs-on: ubuntu-24.04
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4

    steps:
      - name: Checkout SOHCS Sun Shadows branch
        uses: actions/checkout@v4
        with:
          ref: android-sohcs-global-illumination
          fetch-depth: 0
          submodules: false

      - name: Merge, build and verify SOHCS Sun Shadows
        shell: bash
        run: bash scripts/build-sohcs-gi-android.sh

      - name: Upload SOHCS Sun Shadows APK and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOHCS-Sun-Shadows-v4-Android-debug
          path: |
            artifacts/SOHCS-Sun-Shadows-v4-debug.apk
            artifacts/SOHCS-Sun-Shadows-v4-debug.sha256
            artifacts/BUILD-INFO.txt
            artifacts/NATIVE-VALIDATION.txt
            sohcs-gi-badging.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOHCS-Sun-Shadows-v4-build-diagnostics
          path: |
            sohcs-gi-gradle.log
            sohcs-gi-badging.txt
            artifacts/NATIVE-VALIDATION.txt
          if-no-files-found: ignore
          retention-days: 7
